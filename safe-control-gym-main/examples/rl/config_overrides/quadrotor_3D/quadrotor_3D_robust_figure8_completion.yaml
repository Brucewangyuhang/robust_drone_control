task_config:
  seed: 1337
  ctrl_freq: 50
  pyb_freq: 1000
  physics: pyb
  quad_type: 3
  normalized_rl_action_space: True

  # Start at the beginning of the figure-8. Robustness is trained through
  # mid-flight disturbances, not through random episode starting points.
  init_state:
    init_x: 0.0
    init_x_dot: 0.0
    init_y: -0.25
    init_y_dot: 0.0
    init_z: 0.75
    init_z_dot: 0.0
    init_phi: 0.0
    init_theta: 0.0
    init_psi: 0.0
    init_p: 0.0
    init_q: 0.0
    init_r: 0.0
  randomized_init: False
  randomized_inertial_prop: False

  task: traj_tracking
  task_info:
    trajectory_type: figure8
    num_cycles: 1
    trajectory_plane: 'xz'
    trajectory_position_offset: [0, 1]
    trajectory_scale: 1
    proj_point: [0, 0, 0.5]
    proj_normal: [0, 1, 1]

  inertial_prop:
    M: 0.027
    Ixx: 1.4e-5
    Iyy: 1.4e-5
    Izz: 2.17e-5

  # One complete geometric figure-8 is generated over this horizon. The longer
  # horizon gives the policy time to recover from an impulse and still finish.
  episode_len_sec: 12
  cost: rl_reward
  obs_goal_horizon: 1

  # Start-to-finish robust figure-8 completion task.
  tracking_reference_mode: path_following
  path_reference_window: 12
  path_reference_lookahead: 6
  path_reference_search_behind: 3
  path_projection_max_advance: 3
  path_reference_init: start
  path_tracking_reward_weight: 0.2
  path_progress_weight: 50.0
  path_progress_clip: 0.02
  path_progress_gate_scale: 2.0
  path_error_threshold: 0.35
  path_coverage_threshold: 0.2
  path_danger_penalty: 5.0
  path_completion_threshold: 0.98
  path_completion_error_threshold: 0.2
  path_completion_bonus: 100.0
  done_on_path_completion: True
  recovery_error_tolerance: 0.15

  # RL reward.
  rew_state_weight: [1, 0.01, 1, 0.01, 1, 0.01, 0.5, 0.5, 0.5, 0.01, 0.01, 0.01]
  rew_act_weight: 0.0001
  rew_exponential: True
  info_mse_metric_state_weight: [1, 0.01, 1, 0.01, 1, 0.01, 0.5, 0.5, 0.5, 0.01, 0.01, 0.01]

  # Disturbances are placed after takeoff/initial acceleration and before the
  # end of the path, so the policy must recover and keep completing the figure-8.
  disturbances:
    dynamics:
      - disturbance_func: impulse
        apply_probability: 0.75
        magnitude_range: [0.0, 0.5]
        random_direction: True
        step_offset_range: [75, 450]
        duration: 5
        decay_rate: 0.85

  constraints:
    - constraint_form: default_constraint
      constrained_variable: state
      upper_bounds:
        - 2
        - 1
        - 2
        - 1
        - 2
        - 1
        - 0.3
        - 0.3
        - 0.3
        - 1
        - 1
        - 1
      lower_bounds:
        - -2
        - -1
        - -2
        - -1
        - 0
        - -1
        - -0.3
        - -0.3
        - -0.3
        - -1
        - -1
        - -1
    - constraint_form: default_constraint
      constrained_variable: input
      upper_bounds:
        - 0.148
        - 0.148
        - 0.148
        - 0.148
      lower_bounds:
        - 0.029
        - 0.029
        - 0.029
        - 0.029
  done_on_out_of_bound: True
  done_on_violation: False
